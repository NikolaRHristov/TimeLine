packages:
  - "."

  - "Maintain"

# esbuild ships the compiler through a platform package; the post-install hook
# only fetches it when that package is missing, so approving it is what makes
# the build work offline.
allowBuilds:
  '@firebase/util': set this to true or false
  esbuild: true
  protobufjs: set this to true or false
  sharp: true
