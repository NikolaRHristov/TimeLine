packages:
  - "."

  - "Maintain"

# esbuild ships the compiler through a platform package; the post-install hook
# only fetches it when that package is missing, so approving it is what makes
# the build work offline.
allowBuilds:
  "@firebase/util": true
  # sass watches files through @parcel/watcher, whose post-install picks the
  # native binding for this platform. Approving it is what lets `astro dev`
  # rebuild a stylesheet on save; unapproved, pnpm exits 1 and every `pnpm run`
  # stops behind the dependency precheck.
  "@parcel/watcher": true
  esbuild: true
  protobufjs: true
  # re2 is firebase-tools' regex engine for Security Rules. Approving the build
  # installs the prebuilt native binding; leaving it unapproved makes
  # `pnpm install` exit 1 and takes every `pnpm run` down with it.
  re2: true
  sharp: true
