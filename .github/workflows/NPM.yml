name: NPM

concurrency:
  group: NPM-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  release:
    types: [created]
  workflow_call:

jobs:
  Publish:
    runs-on: ubuntu-latest
    environment: Release
    env:
      ADBLOCK: true
      ASTRO_TELEMETRY_DISABLED: 1
      AUTOMATEDLAB_TELEMETRY_OPTOUT: 1
      AZURE_CORE_COLLECT_TELEMETRY: 0
      CHOOSENIM_NO_ANALYTICS: 1
      DIEZ_DO_NOT_TRACK: 1
      DO_NOT_TRACK: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_INTERACTIVE_CLI_TELEMETRY_OPTOUT: 1
      ET_NO_TELEMETRY: 1
      GATSBY_TELEMETRY_DISABLED: 1
      GATSBY_TELEMETRY_OPT_OUT: 1
      GATSBY_TELEMETRY_OPTOUT: 1
      GRIT_TELEMETRY_DISABLED: 1
      HASURA_GRAPHQL_ENABLE_TELEMETRY: false
      HINT_TELEMETRY: off
      HOMEBREW_NO_ANALYTICS: 1
      INFLUXD_REPORTING_DISABLED: true
      ITERATIVE_DO_NOT_TRACK: 1
      NEXT_TELEMETRY_DEBUG: 1
      NEXT_TELEMETRY_DISABLED: 1
      NG_CLI_ANALYTICS: false
      NUXT_TELEMETRY_DISABLED: 1
      PIN_DO_NOT_TRACK: 1
      POWERSHELL_TELEMETRY_OPTOUT: 1
      SAM_CLI_TELEMETRY: 0
      STNOUPGRADE: 1
      STRIPE_CLI_TELEMETRY_OPTOUT: 1
      TELEMETRY_DISABLED: 1
      TERRAFORM_TELEMETRY: 0
      VCPKG_DISABLE_METRICS: 1

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The publish below cannot succeed while the root package is marked
      # private, and a green job that published nothing is worse than a red one.
      # This fails before any install so the reason is the first thing in the log.
      - name: Guard private package
        working-directory: .
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::node is not on PATH; the guard cannot read package.json, so this job cannot establish that publishing is possible."
            exit 1
          fi
          if [ ! -f package.json ]; then
            echo "::error file=package.json::package.json is missing; the guard cannot establish that publishing is possible."
            exit 1
          fi
          if [ "$(node -e "const p = require('./package.json'); process.stdout.write(p.private === true ? 'true' : 'false')")" = "true" ]; then
            echo "::error file=package.json::package.json sets \"private\": true, so npm publish refuses and nothing is published."
            echo "Resolve it one of two ways: drop \"private\" from package.json if this package is meant to be published, or retire this workflow if it is not."
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # The same pin as `packageManager` in the root `package.json`.
          version: 11.18.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - run: npm install -g npm@latest

      # `prepublishOnly` is `pnpm run build`, and the publish command below does
      # not run lifecycle scripts - so the build has to happen here, in the open.
      - run: pnpm install --frozen-lockfile
        working-directory: .

      - run: pnpm run build
        working-directory: .

      - name: Publish .
        working-directory: .
        run: npm publish
